<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mdplus</title>
    <script>
      (function () {
        // Keep in step with APPEARANCES in src/lib/themes.ts.
        var tones = { light: "light", paper: "light", fog: "light", dark: "dark", ink: "dark", moss: "dark", dusk: "dark" };
        var cached = localStorage.getItem("mdplus-theme");
        var theme = tones[cached]
          ? cached
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.setAttribute("data-tone", tones[theme]);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
